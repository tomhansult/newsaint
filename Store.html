<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store | New Saint</title>
  <link rel="icon" type="image/x-icon" href="images/FAVICON.ico">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ====== PAGE HEADER ====== */
    .store-hero {
      text-align: center;
      padding: 4rem 2rem 2rem;
    }

    /* ====== FILTER BAR ====== */
    .filter-bar {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 2rem 0;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid #000;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .filter-btn.active {
      background: #000;
      color: #fff;
    }

    /* ====== PRODUCT GRID – STRICT 2 COLUMNS ====== */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 4rem;
    }

    /* ====== PRODUCT CARD ====== */
    .product-card {
      display: flex;
      flex-direction: column;
      background: #fff;       /* keeps your current background */
      border: none;
    }

    /* Image wrapper: fixed aspect ratio, no cropping */
    .product-card .img-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;       /* prevent any image bleed */
      background: #f5f5f5;    /* subtle background for letterboxed areas */
    }

    .product-card .img-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;    /* FULL product visible, no cuts */
      display: block;
    }

    /* Text anchored below image */
    .product-card h4 {
      margin: 0.75rem 0 0.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .product-card p {
      margin: 0 0 0.75rem;
      color: #666;
      font-size: 0.9rem;
    }

    .add-to-cart {
      margin-top: auto;
      background: #000;
      color: #fff;
      border: none;
      padding: 0.6rem 1rem;
      cursor: pointer;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 100%;
    }

    /* ====== CART DRAWER (unchanged) ====== */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 380px;
      max-width: 90vw;
      height: 100vh;
      background: #fff;
      box-shadow: -5px 0 15px rgba(0,0,0,0.1);
      z-index: 2000;
      transition: right 0.3s ease;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      color: #000;
    }
    .cart-drawer.open { right: 0; }
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1999;
      display: none;
    }
    .cart-overlay.show { display: block; }
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      margin: 1rem 0;
    }
    .cart-item {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #eee;
    }
    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      background: #f5f5f5;
    }
    .cart-item-details { flex: 1; }
    .qty-control {
      display: flex;
      gap: 0.3rem;
      align-items: center;
      margin-top: 0.3rem;
    }
    .qty-btn {
      background: #f0f0f0;
      border: none;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 1rem;
    }
    .remove-item {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 1.2rem;
    }
    .cart-total {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 1rem 0;
    }
    .checkout-btn {
      background: #000;
      color: #fff;
      border: none;
      padding: 1rem;
      width: 100%;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* ====== RESPONSIVE: single column on very small screens ====== */
    @media (max-width: 400px) {
      .product-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header id="header">
    <nav>
      <a href="index.html" class="logo">NEW SAINT</a>
      <input type="checkbox" id="menu-toggle">
      <label for="menu-toggle" class="hamburger">&#9776;</label>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="store.html" class="active">Store</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="#" id="cart-icon">Cart (<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="store-hero">
      <h1>STORE</h1>
      <p>Wear the Uniform. Become Someone New.</p>
    </section>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="t-shirts">T-Shirts</button>
      <button class="filter-btn" data-filter="hoodies">Hoodies</button>
      <button class="filter-btn" data-filter="accessories">Accessories</button>
    </div>

    <div class="product-grid" id="product-grid"></div>
  </main>

  <footer>
    <p>&copy; 2026 New Saint. Wear Your Story.</p>
  </footer>

  <button id="back-to-top" title="Back to top">↑</button>

  <script src="main.js"></script>
  <script>
    // -------------------------------------------------
    // PRODUCTS ARRAY – exact filenames from your folder
    // -------------------------------------------------
    const products = [
      { id: 1,  name: "Xavier Edition Cropped Tee", price: 550, category: "t-shirts",    image: "assets/images/Products/Xavier edition cropped Tee.avif" },
      { id: 2,  name: "Xavier Collection",          price: 750, category: "t-shirts",    image: "assets/images/Products/Xavier collection .avif" },
      { id: 3,  name: "Unsleeved Hoodie",           price: 890, category: "hoodies",     image: "assets/images/Products/Unsleeved .avif" },
      { id: 4,  name: "Two Tone Hoodie",            price: 950, category: "hoodies",     image: "assets/images/Products/Two tone hoodie.avif" },
      { id: 5,  name: "Santiano Long Sleeve",       price: 620, category: "t-shirts",    image: "assets/images/Products/Santiano long sleeve .avif" },
      { id: 6,  name: "Santiano Beanie",            price: 350, category: "accessories", image: "assets/images/Products/Santiano beanie.avif" },
      { id: 7,  name: "Saint V Tee",                price: 490, category: "t-shirts",    image: "assets/images/Products/Saint V.avif" },
      { id: 8,  name: "Saint Tears Edition",        price: 780, category: "t-shirts",    image: "assets/images/Products/Saint tears edition .avif" },
      { id: 9,  name: "Saint Short XO",             price: 680, category: "t-shirts",    image: "assets/images/Products/Saint short xo.avif" },
      { id: 10, name: "Saint Hoodie",               price: 890, category: "hoodies",     image: "assets/images/Products/Saint hoodie.avif" },
      { id: 11, name: "Saint Crown Tee",            price: 520, category: "t-shirts",    image: "assets/images/Products/Saint Crown.avif" },
      { id: 12, name: "Pink Santiano Hoodie",       price: 950, category: "hoodies",     image: "assets/images/Products/Pink santiano hoodie.avif" },
      { id: 13, name: "New Saint Beanie",           price: 350, category: "accessories", image: "assets/images/Products/New saint beanie .avif" },
      { id: 14, name: "Leather Shorts Front",       price: 1100, category: "accessories", image: "assets/images/Products/Leather shorts front.avif" },
      { id: 15, name: "Jesus Crown of Thorns",      price: 780, category: "t-shirts",    image: "assets/images/Products/Jesus crown of thorns.avif" },
      { id: 16, name: "Crown of Thorns Edition",    price: 780, category: "t-shirts",    image: "assets/images/Products/Crown of thorns edition .avif" },
      { id: 17, name: "Crown of Thorns Edition II", price: 780, category: "t-shirts",    image: "assets/images/Products/crown of thorns edition .avif" },
      { id: 18, name: "Cropped Tee",                price: 450, category: "t-shirts",    image: "assets/images/Products/Cropped Tee .avif" },
      { id: 19, name: "Camo Shorts",                price: 750, category: "accessories", image: "assets/images/Products/Camo shorts.avif" },
      { id: 20, name: "Camo Designer Piece",        price: 1200, category: "accessories", image: "assets/images/Products/Camo designer.avif" },
    ];

    const grid = document.getElementById('product-grid');

    function renderProducts(filter = 'all') {
      const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
      grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          <div class="img-container">
            <img src="${p.image}" alt="${p.name}" loading="lazy"
                 onerror="this.onerror=null; this.src='assets/images/Products/Saint hoodie.avif';">
          </div>
          <h4>${p.name}</h4>
          <p>R${p.price}</p>
          <button class="add-to-cart" data-id="${p.id}">Add to Cart</button>
        </div>
      `).join('');

      // Attach Add to Cart listeners
      document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const prod = products.find(p => p.id === id);
          addToCart(prod);  // from main.js
          document.getElementById('cart-icon').click();
        });
      });
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts(btn.dataset.filter);
      });
    });

    // Initial load
    renderProducts();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store | New Saint</title>
  <link rel="icon" type="image/x-icon" href="images/FAVICON.ico">
  <link rel="stylesheet" href="styles.css">
  <style>
    .store-hero { text-align: center; padding: 4rem 2rem 2rem; }
    .filter-bar { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin: 2rem 0; }
    .filter-btn { background: transparent; border: 1px solid #000; padding: 0.5rem 1.2rem; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    .filter-btn.active { background: #000; color: #fff; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; max-width: 1400px; margin: 0 auto; padding: 0 2rem 4rem; }
    .product-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; }
    .product-card h4 { margin: 0.5rem 0 0.2rem; }
    .add-to-cart { margin-top: 0.5rem; background: #000; color: #fff; border: none; padding: 0.6rem 1.5rem; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    /* Cart drawer */
    .cart-drawer { position: fixed; top: 0; right: -100%; width: 380px; max-width: 90vw; height: 100vh; background: #fff; box-shadow: -5px 0 15px rgba(0,0,0,0.1); z-index: 2000; transition: right 0.3s ease; padding: 2rem; display: flex; flex-direction: column; color: #000; }
    .cart-drawer.open { right: 0; }
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1999; display: none; }
    .cart-overlay.show { display: block; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.2rem; }
    .cart-items { flex: 1; overflow-y: auto; margin: 1rem 0; }
    .cart-item { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #eee; }
    .cart-item img { width: 60px; height: 60px; object-fit: cover; }
    .cart-item-details { flex: 1; }
    .qty-control { display: flex; gap: 0.3rem; align-items: center; margin-top: 0.3rem; }
    .qty-btn { background: #f0f0f0; border: none; width: 24px; height: 24px; cursor: pointer; font-size: 1rem; }
    .remove-item { background: none; border: none; color: #999; cursor: pointer; font-size: 1.2rem; }
    .cart-total { font-size: 1.2rem; font-weight: bold; margin: 1rem 0; }
    .checkout-btn { background: #000; color: #fff; border: none; padding: 1rem; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
  </style>
</head>
<body>
  <header id="header">
    <nav>
      <a href="index.html" class="logo">NEW SAINT</a>
      <input type="checkbox" id="menu-toggle">
      <label for="menu-toggle" class="hamburger">&#9776;</label>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="store.html" class="active">Store</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="#" id="cart-icon">Cart (<span id="cart-count">0</span>)</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="store-hero">
      <h1>STORE</h1>
      <p>Wear the Uniform. Become Someone New.</p>
    </section>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="t-shirts">T-Shirts</button>
      <button class="filter-btn" data-filter="hoodies">Hoodies</button>
      <button class="filter-btn" data-filter="accessories">Accessories</button>
    </div>

    <div class="product-grid" id="product-grid"></div>
  </main>

  <footer>
    <p>&copy; 2026 New Saint. Wear Your Story.</p>
  </footer>

  <button id="back-to-top" title="Back to top">↑</button>

  <script src="main.js"></script>
  <script>
    // Products using only images that exist in your repo
    const products = [
      { id: 1, name: "Logo T-Shirt", price: 450, category: "t-shirts", image: "images/tshirt1.PNG" },
      { id: 2, name: "Graphic Tee", price: 490, category: "t-shirts", image: "images/tshirt2.PNG" },
      { id: 3, name: "Essential Hoodie", price: 890, category: "hoodies", image: "images/hoodie1.PNG" },
      { id: 4, name: "Box Fit Hoodie", price: 950, category: "hoodies", image: "images/hoodie2.PNG" },
      { id: 5, name: "Cap", price: 350, category: "accessories", image: "images/cap1.PNG" },
      { id: 6, name: "Tote Bag", price: 280, category: "accessories", image: "images/tote.PNG" } // will fallback to hoodie if missing
    ];

    const grid = document.getElementById('product-grid');
    function renderProducts(filter = 'all') {
      const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
      grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.onerror=null; this.src='images/hoodie1.PNG';">
          <h4>${p.name}</h4>
          <p>R${p.price}</p>
          <button class="add-to-cart" data-id="${p.id}">Add to Cart</button>
        </div>
      `).join('');

      document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const prod = products.find(p => p.id === id);
          addToCart(prod);
          document.getElementById('cart-icon').click();
        });
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts(btn.dataset.filter);
      });
    });

    renderProducts();
  </script>
</body>
</html>

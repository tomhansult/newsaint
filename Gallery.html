<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lookbook | New Saint</title>
  <link rel="icon" type="image/x-icon" href="images/FAVICON.ico">
  <link rel="stylesheet" href="styles.css">
  <style>
    .gallery-hero {
      text-align: center;
      padding: 4rem 2rem 2rem;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;   /* 2 columns */
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 4rem;
    }
    .gallery-item {
      overflow: hidden;
    }
    .gallery-item img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.03);
    }
    .gallery-note {
      text-align: center;
      padding: 2rem 0 4rem;
      color: #666;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 600px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
